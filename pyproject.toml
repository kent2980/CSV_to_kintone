[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-to-kintone"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["customtkinter>=5.2,<6", "pystray>=0.19,<1", "Pillow>=10,<13", "requests>=2.31,<3", "pywin32>=306"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
